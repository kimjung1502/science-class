<script>
  // ⚠️ 이 인라인 스크립트는 IIFE로 안 감싸진 최상위 스코프라, supabase-js UMD가 만든 전역 `supabase`와
  //    충돌하지 않도록 여기서 `supabase`를 구조분해하지 않는다(대신 아래에서 window.DB.supabase 사용).
  const { fetchSubjectTree, MATERIAL_TYPES, esc, safeUrl, requireLogin, signOut, uploadToBucket, removeMaterialFile, uploadMaterialToDrive, materialUrl, openInNewTab, driveIdOf, pdfPageCount, splitPdfFile, safeStorageName, toLocalInput, wireSidebar, pickDriveFile } = window.DB;

  const params = new URLSearchParams(location.search);
  const subjectId = params.get('subject');

  const $ = (id) => document.getElementById(id);
  const state = { tree: null, lastUnitId: null, midUnitId: null, subunitId: null, isAdmin: false, addingSubId: null, student: null };

  const closeSidebar = wireSidebar(); // 모바일 서랍 + 미구현 링크

  // height 애니메이션으로 펼치기/접기
  function setOpen(box, open) {
    if (open) {
      box.style.height = box.scrollHeight + 'px';
      const done = (e) => { if (e.propertyName === 'height') { box.style.height = 'auto'; box.removeEventListener('transitionend', done); } };
      box.addEventListener('transitionend', done);
    } else {
      box.style.height = box.scrollHeight + 'px';
      box.getBoundingClientRect(); // reflow
      requestAnimationFrame(() => { box.style.height = '0px'; });
    }
  }

  // ---------- 자료 카드 ----------
  // 공개 기간 배지 — 기간 밖 자료는 학생에겐 RLS로 아예 안 내려가므로 '예정/종료'는 교사 화면에만 나타나고,
  // 기간 안이면서 종료일이 있는 자료는 학생에게도 '~언제까지'를 알려준다.
  const fmtDT = (iso) => { const d = new Date(iso); const p = (n) => String(n).padStart(2, '0'); return `${d.getMonth() + 1}/${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())}`; };
  function visibilityBadge(m) {
    if (!m.visible_from && !m.visible_until) return '';
    const now = Date.now();
    if (m.visible_from && now < new Date(m.visible_from).getTime())
      return `<span class="font-mono text-[10px] font-bold text-ink2 bg-paper2 border border-faint px-1.5 py-0.5 rounded shrink-0">${fmtDT(m.visible_from)} 공개</span>`;
    if (m.visible_until && now > new Date(m.visible_until).getTime())
      return '<span class="font-mono text-[10px] font-bold text-ink3 bg-paper2 border border-faint px-1.5 py-0.5 rounded shrink-0">공개 종료</span>';
    if (m.visible_until)
      return `<span class="font-mono text-[10px] font-bold text-ink2 bg-paper2 border border-faint px-1.5 py-0.5 rounded shrink-0">~${fmtDT(m.visible_until)}</span>`;
    return '';
  }
  // 저장소에 함께 배포되는 실험 HTML은 url 에 '실험 수업/…' 같은 상대 경로로 등록한다.
  // 그러면 스토리지에 사본을 올리지 않아도 되고, 파일을 고쳐 배포하면 바로 반영된다.
  // (예전에는 '이상 기체' 이름을 정규식으로 잡아 경로를 코드에 박아 뒀다. 실험이 늘 때마다
  //  코드를 고쳐야 해서, 절대 URL 이 아니면 번들로 보는 방식으로 바꿨다.)
  function bundledHtmlUrl(m) {
    if (!m || m.type !== 'html') return '';
    const u = String(m.url || '').trim();
    if (!u || /^(https?:)?\/\//i.test(u)) return '';   // 빈 값·외부 절대 URL 은 번들이 아니다
    return new URL(u, window.location.href).href;
  }
  function materialCard(m) {
    const t = MATERIAL_TYPES[m.type];
    if (!t) return '';
    const name = m.name || t.label;
    const bundledUrl = bundledHtmlUrl(m);
    // 저장소(드라이브·버킷)에 있는 자료는 주소를 미리 박지 않는다. 카드에는 자료 id 만 심고,
    // 누르는 순간 materialUrl() 로 5분짜리 서명 링크를 받는다 — 권한 판정은 서버 RLS 가 한다.
    // 예전에는 프록시 주소를 그대로 박아 둬서, 그 주소가 새면 로그인 없이 열렸다.
    const stored = !bundledUrl && !!m.storage_path;
    // 파일형인데 storage_path가 아예 없으면 진짜 외부 링크다 → 새 탭, ?download 미부여
    const isExternal = !bundledUrl && t.file && !stored && m.url && m.url !== '#';
    let href = bundledUrl || (stored ? '#' : (m.url || '#'));

    // html 자료(실험 페이지 등): 링크로 열지 않고 카드 아래에 아코디언으로 펼쳐서 바로 보여준다.
    // (Supabase 오브젝트가 XSS 방지로 text/html을 text/plain으로 내려서 그냥 링크로 열면 소스가 보임
    //  → 아코디언을 펼 때 fetch로 원문을 받아 iframe에 srcdoc으로 주입해 렌더링)
    if (m.type === 'html' && !isExternal && (stored || href !== '#')) {
      return materialHtmlCard(m, t, name, stored ? '' : href, stored);
    }

    const newTab = t.newTab || isExternal || stored;
    const tabAttr = newTab ? ' target="_blank" rel="noopener"' : '';
    const meta = m.meta || (newTab ? '새 탭에서 열기' : '');
    // 저장소 자료의 원본 파일명은 서명 링크(드라이브 프록시·Storage 서명 URL)가 붙여 준다 → 여기선 제외
    if (t.file && !isExternal && !stored && m.original_filename && m.type !== 'video' && href !== '#') {
      href += (href.indexOf('?') >= 0 ? '&' : '?') + 'download=' + encodeURIComponent(m.original_filename);
    }
    const openAttr = stored ? ` data-mat="${esc(m.id)}"` : '';
    const teacherBadge = (m.teacher_only ? '<span class="font-mono text-[10px] font-bold text-signal bg-signal-soft px-1.5 py-0.5 rounded shrink-0">교사만</span>' : '') + visibilityBadge(m);
    return `<a href="${esc(safeUrl(href))}"${tabAttr}${openAttr} class="group card lift-hover p-4 rounded-lg shadow-note hover:shadow-lift hover:border-ink/30 transition-all duration-200 flex items-center gap-3 min-h-[56px]">
      <div class="p-2 ${t.box} rounded-lg shrink-0"><span class="material-symbols-outlined lab-ic">${t.icon}</span></div>
      <div class="flex-1 overflow-hidden"><p class="text-[14px] font-bold text-ink truncate">${esc(name)}</p><p class="font-mono text-[11px] text-ink3 truncate">${esc(meta)}</p></div>
      ${teacherBadge}
      <span class="material-symbols-outlined lab-ic text-ink3 opacity-0 group-hover:opacity-100 transition-opacity">${t.action}</span>
    </a>`;
  }

  // stored=true 면 href 대신 자료 id 를 심고, 펼칠 때 서명 링크를 받아 온다.
  function materialHtmlCard(m, t, name, href, stored) {
    const srcAttr = stored ? ` data-html-mat="${esc(m.id)}"` : ` data-html-src="${esc(href)}"`;
    const teacherBadge = (m.teacher_only ? '<span class="font-mono text-[10px] font-bold text-signal bg-signal-soft px-1.5 py-0.5 rounded shrink-0">교사만</span>' : '') + visibilityBadge(m);
    const meta = m.meta || '눌러서 펼치기';
    const panelId = 'mat-html-panel-' + m.id;
    return `<div class="col-span-full card rounded-lg overflow-hidden shadow-note">
      <button type="button" class="mat-html-toggle w-full group p-4 flex items-center gap-3 min-h-[56px] text-left hover:bg-paper2/60 transition-colors"${srcAttr} data-panel="${panelId}" aria-expanded="false">
        <div class="p-2 ${t.box} rounded-lg shrink-0"><span class="material-symbols-outlined lab-ic">${t.icon}</span></div>
        <div class="flex-1 overflow-hidden"><p class="text-[14px] font-bold text-ink truncate">${esc(name)}</p><p class="font-mono text-[11px] text-ink3 truncate">${esc(meta)}</p></div>
        ${teacherBadge}
        <span class="material-symbols-outlined lab-ic text-ink3 mat-html-arrow transition-transform">expand_more</span>
      </button>
      <div class="acc-panel" id="${panelId}" style="height:0">
        <div class="dashed bg-paper/40">
          <div class="flex items-center justify-end p-2">
            <button type="button" class="mat-html-newtab inline-flex items-center gap-1 font-mono text-[11px] text-ink3 hover:text-signal px-2 py-1 rounded"${srcAttr}>
              <span class="material-symbols-outlined lab-ic text-[16px]">open_in_new</span>새 탭에서 크게 보기
            </button>
          </div>
          <div style="height:min(80vh,760px)"><iframe class="w-full h-full border-0 bg-white" title="${esc(name)}"></iframe></div>
        </div>
      </div>
    </div>`;
  }

  // html 실험 자료 안에서 이름·학번 입력창 없이 바로 쓸 수 있도록, 이 사이트에 로그인한 학생 정보를
  // window.__SITE_STUDENT__ 전역으로 주입해 넘겨준다(해당 페이지 쪽에서 읽어 자동으로 채움).
  function injectStudentInfo(html) {
    // isAdmin: 교사 계정은 students 레코드가 없어 이름·학번이 없음(정상) — 실험 페이지 쪽에서
    // "로그인 안 됨" 경고와 구분해 "교사 미리보기"로 다르게 안내하도록 플래그를 함께 넘김.
    const info = { name: (state.student && state.student.name) || '', sid: (state.student && state.student.student_number) || '', isAdmin: state.isAdmin };
    const tag = '<scr' + 'ipt>window.__SITE_STUDENT__=' + JSON.stringify(info).replace(/</g, '\\u003c') + ';</scr' + 'ipt>';
    return /<head[^>]*>/i.test(html) ? html.replace(/<head[^>]*>/i, (m) => m + tag) : tag + html;
  }
  // 번들 자료(data-html-src)는 상대 경로 그대로, 저장소 자료(data-html-mat)는 서명 링크를 받아 온다.
  // 둘 다 Promise<string> 을 돌려주므로 아래 두 함수는 구분할 필요가 없다.
  function htmlSrcOf(btn) {
    const mat = btn.dataset.htmlMat;
    return mat ? materialUrl(mat) : Promise.resolve(btn.dataset.htmlSrc);
  }
  async function loadHtmlIntoIframe(iframe, urlOrPromise) {
    iframe.srcdoc = '<p style="font:14px system-ui;padding:16px;color:#666">불러오는 중…</p>';
    try {
      const url = await urlOrPromise;
      const res = await fetch(url, { cache: 'no-store' });
      if (!res.ok) throw new Error('불러오기 실패 (' + res.status + ')');
      iframe.srcdoc = injectStudentInfo(await res.text());
    } catch (e) {
      iframe.srcdoc = '<p style="font:14px system-ui;padding:16px;color:#b3261e">불러오지 못했습니다: ' + esc(e.message) + '</p>';
    }
  }
  // 새 탭에서 크게 보기: 팝업 차단 회피를 위해 먼저 빈 탭을 열고, fetch한 원문을 text/html Blob으로 교체
  async function openHtmlMaterial(urlOrPromise) {
    const w = window.open('', '_blank');
    try {
      const url = await urlOrPromise;
      const res = await fetch(url, { cache: 'no-store' });
      if (!res.ok) throw new Error('불러오기 실패 (' + res.status + ')');
      const text = injectStudentInfo(await res.text());
      const blobUrl = URL.createObjectURL(new Blob([text], { type: 'text/html' }));
      if (w) w.location = blobUrl;
    } catch (e) {
      if (w) w.document.write('페이지를 불러오지 못했습니다: ' + esc(e.message));
    }
  }

  // 판서로 열 수 있는 PDF인지: 저장소(버킷·드라이브)에 실제 파일이 있는 자료만.
  // m.url 은 업로드 당시 주소라 이제 열람에 쓰지 않는다 — storage_path 유무로만 판정한다.
  function isPdfMaterial(m) {
    if (!m) return false;
    const direct = !!m.storage_path;
    const pdfish = m.type === 'print' || /\.pdf(\?|$)/i.test(m.url || '') || /\.pdf$/i.test(m.original_filename || '');
    return !!(direct && pdfish);
  }
  // 서명 링크는 5분이면 만료되고 주소창·방문기록에 남는 것도 달갑지 않다.
  // 자료 id 만 넘기고 판서 페이지가 열 때 직접 발급받게 한다.
  function drawHref(m) {
    const t = MATERIAL_TYPES[m.type];
    const name = m.name || (t && t.label) || 'PDF';
    return `PDF-판서.html?mat=${encodeURIComponent(m.id)}&title=${encodeURIComponent(name)}`;
  }

  function matCardWrap(m) {
    const card = materialCard(m);
    if (!state.isAdmin) return card;
    const wrapClass = m.type === 'html' ? 'relative group/mat col-span-full' : 'relative group/mat';
    // 교사 화면: PDF 자료엔 항상 보이는 '판서' 버튼(S펜 판서 뷰어로 바로 열기)
    const drawBtn = isPdfMaterial(m)
      ? `<a href="${esc(drawHref(m))}" target="_blank" rel="noopener" title="판서로 열기 (S펜 필기)" class="draw-material absolute bottom-1.5 right-1.5 z-[1] inline-flex items-center gap-1 font-mono text-[10px] font-bold px-2 py-1 rounded-md bg-ink text-lime shadow-sm hover:bg-ink2 transition-colors"><span class="material-symbols-outlined lab-ic text-[14px]">draw</span>판서</a>`
      : '';
    return `<div class="${wrapClass}">${card}${drawBtn}
      <button data-edit-mat="${m.id}" title="자료 수정" class="edit-material absolute top-1.5 right-1.5 p-1 rounded-md bg-white/95 border border-faint text-ink3 hover:text-ink shadow-sm opacity-0 group-hover/mat:opacity-100 transition-opacity">
        <span class="material-symbols-outlined lab-ic text-[16px]">edit</span></button>
    </div>`;
  }
  function materialsBlock(sub) {
    const materials = sub.materials || [];
    const addBtn = state.isAdmin
      ? `<button data-add-sub="${sub.id}" class="add-material inline-flex items-center gap-1 font-mono text-[11px] font-bold text-ink px-2.5 py-1.5 rounded-lg border border-ink/30 hover:bg-ink hover:text-paper transition-colors"><span class="material-symbols-outlined lab-ic text-[16px]">add</span>자료 추가</button>`
      : '';
    const header = `<div class="flex items-center gap-3 mb-4"><h5 class="font-mono text-[11px] font-bold text-ink3 uppercase tracking-[0.18em] shrink-0">학습 자료</h5><span class="dashed flex-1"></span>${addBtn}</div>`;
    if (!materials.length) {
      return `${header}<p class="flex items-center justify-center gap-2 text-ink3 text-[13.5px] py-8"><span class="material-symbols-outlined lab-ic text-ink3">folder_off</span>등록된 학습 자료가 없습니다.</p>`;
    }
    return `${header}<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">${materials.map(matCardWrap).join('')}</div>`;
  }

  function subunitItem(u, i) {
    const no = String(i + 1).padStart(2, '0');
    const active = u.id === state.subunitId; // 선택한 소단원만 펼침 (중단원만 고르면 모두 접힘)
    return `<div id="sub-${u.id}" class="sub-card scroll-mt-20 bg-white border ${active ? 'border-primary/40' : 'border-outline-variant'} rounded-xl overflow-hidden shadow-note hover:shadow-lift transition-all">
      <button class="card-toggle w-full flex items-center justify-between p-5 text-left hover:bg-paper2/60 transition-colors" aria-expanded="${active}">
        <div class="flex items-center gap-4">
          <div class="sub-badge w-10 h-10 rounded-lg ${active ? 'bg-primary text-white' : 'bg-surface-container text-on-surface-variant'} flex items-center justify-center font-mono font-bold shrink-0 transition-colors">${no}</div>
          <div>
            <h4 class="text-lg font-extrabold tracking-tightest text-ink">${esc(u.name)}</h4>
            <p class="text-[13px] text-ink3 mt-0.5">${esc(u.description)}</p>
          </div>
        </div>
        <span class="material-symbols-outlined lab-ic arrow text-ink3 ${active ? 'rotate-180' : ''}">expand_more</span>
      </button>
      <div class="acc-panel" style="height:${active ? 'auto' : '0'}">
        <div class="p-5 dashed bg-paper/40">
          ${materialsBlock(u)}
        </div>
      </div>
    </div>`;
  }

  // ---------- 현재 선택 정보 찾기 ----------
  function findSelection() {
    const units = state.tree.units || [];
    // 열려 있는 대단원 (중단원 미선택 시에도 유지)
    const unit = units.find((u) => u.id === state.lastUnitId) || null;
    // 선택된 중단원 (없으면 null → 메인 비움)
    let mid = null;
    for (const u of units) {
      for (const m of u.mid_units || []) {
        if (m.id === state.midUnitId) mid = m;
      }
    }
    return { unit, mid };
  }

  // ---------- 사이드바 ----------
  function renderSidebar(animate) {
    const nav = $('sidebar-nav');
    nav.innerHTML = (state.tree.units || []).map((u) => {
      const unitOpen = u.id === state.lastUnitId;
      const mids = (u.mid_units || []).map((m) => {
        const on = m.id === state.midUnitId;
        const subs = (m.subunits || []).map((s) => {
          const sOn = s.id === state.subunitId;
          return `<button data-sub="${s.id}" data-mid="${m.id}" class="sub-btn w-full flex items-center gap-2 p-2 rounded-lg transition-all text-[12.5px] text-left ${sOn ? 'bg-lime-soft text-ink font-bold' : 'text-ink3 hover:bg-paper3/60'}">
            <span class="material-symbols-outlined lab-ic text-[16px] ${sOn ? 'text-signal' : 'text-ink3/60'}">${sOn ? 'check_circle' : 'radio_button_unchecked'}</span>
            <span>${esc(s.name)}</span>
          </button>`;
        }).join('');
        return `<div>
          <button data-mid="${m.id}" data-unit="${u.id}" class="mid-btn w-full flex items-center justify-between p-2.5 rounded-lg transition-all text-left ${on ? 'bg-ink text-paper font-bold' : 'text-ink3 hover:bg-paper3/60'}">
            <span class="text-[13px] text-left">${esc(m.name)}</span>
            <span class="material-symbols-outlined lab-ic text-[16px] mid-chevron ${on ? 'rotate-180 text-lime' : 'text-ink3/60'}">expand_more</span>
          </button>
          ${on ? `<div class="mt-1 ml-3 pl-2 border-l border-ink/15 space-y-0.5 ${animate ? 'swap-in' : ''}">${subs || '<p class="text-[12px] text-ink3 p-2">소단원이 없습니다.</p>'}</div>` : ''}
        </div>`;
      }).join('');
      return `<div>
        <button data-unit="${u.id}" class="unit-toggle w-full flex items-center justify-between p-2.5 rounded-lg hover:bg-paper3/60 transition-all text-left">
          <span class="text-[13px] font-bold ${unitOpen ? 'text-ink' : 'text-ink3'}">${esc(u.name)}</span>
          <span class="material-symbols-outlined lab-ic arrow-icon text-ink3 ${unitOpen ? 'rotate-180' : ''}">expand_more</span>
        </button>
        <div class="acc-panel" style="height:${unitOpen ? 'auto' : '0'}"><div class="mt-1 space-y-1">${mids}</div></div>
      </div>`;
    }).join('');

    nav.querySelectorAll('.unit-toggle').forEach((btn) =>
      btn.addEventListener('click', () => {
        const box = btn.nextElementSibling;
        const open = btn.querySelector('.arrow-icon').classList.toggle('rotate-180');
        if (open) state.lastUnitId = btn.dataset.unit; // 열면 이 대단원을 현재 열린 것으로 기억
        setOpen(box, open);
      })
    );
    nav.querySelectorAll('.mid-btn').forEach((btn) =>
      btn.addEventListener('click', () => {
        state.lastUnitId = btn.dataset.unit;                 // 부모 대단원은 계속 열림
        state.midUnitId = (state.midUnitId === btn.dataset.mid) ? null : btn.dataset.mid; // 같은 중단원 다시 누르면 접기
        state.subunitId = null;
        render(true);
      })
    );
    nav.querySelectorAll('.sub-btn').forEach((btn) =>
      btn.addEventListener('click', () => {
        const sameMid = btn.dataset.mid === state.midUnitId;
        state.midUnitId = btn.dataset.mid;
        state.subunitId = btn.dataset.sub;
        if (sameMid) { renderSidebar(); openSubunitCard(state.subunitId); }  // 목록 유지 → 카드만 애니메이션
        else { render(true); scrollToActive(); }                             // 다른 중단원 → 목록 교체(애니메이션)
        closeSidebar(); // 모바일: 소단원 선택 시 서랍 닫아 본문 표시
      })
    );
  }

  function scrollToActive() {
    if (!state.subunitId) return;
    requestAnimationFrame(() => $('sub-' + state.subunitId)?.scrollIntoView({ behavior: 'smooth', block: 'start' }));
  }

  // 메인 목록을 다시 그리지 않고, 클릭한 소단원 카드만 부드럽게 펼치고 나머지는 접기
  function openSubunitCard(subId) {
    document.querySelectorAll('#subunit-list .sub-card').forEach((card) => {
      const on = card.id === 'sub-' + subId;
      const btn = card.querySelector('.card-toggle');
      const arrow = btn.querySelector('.arrow');
      const badge = card.querySelector('.sub-badge');
      const wasOpen = arrow.classList.contains('rotate-180');
      if (on !== wasOpen) {
        arrow.classList.toggle('rotate-180', on);
        btn.setAttribute('aria-expanded', on);
        setOpen(btn.nextElementSibling, on);
      }
      // 강조 스타일 전환
      card.classList.toggle('border-primary/40', on);
      card.classList.toggle('border-outline-variant', !on);
      badge.classList.toggle('bg-primary', on);
      badge.classList.toggle('text-white', on);
      badge.classList.toggle('bg-surface-container', !on);
      badge.classList.toggle('text-on-surface-variant', !on);
    });
    scrollToActive();
  }

  // ---------- 브레드크럼 · 히어로 · 소단원 ----------
  function renderMain(animate) {
    const { unit, mid } = findSelection();
    const chev = '<span class="material-symbols-outlined lab-ic text-ink3/60 text-[16px]">chevron_right</span>';
    $('breadcrumb').innerHTML = [
      `<span class="text-ink3">${esc(state.tree.name)}</span>`,
      unit ? `<span class="text-ink3">${esc(unit.name)}</span>` : '',
      mid ? `<span class="text-ink font-bold hl-soft">${esc(mid.name)}</span>` : '',
    ].filter(Boolean).join(chev);

    $('hero-subject').textContent = state.tree.name;
    $('hero-path').innerHTML = [unit && esc(unit.name), mid && esc(mid.name)].filter(Boolean).join(' <span class="text-signal">›</span> ');

    const list = $('subunit-list');
    const subs = (mid && mid.subunits) || [];
    list.innerHTML = !mid
      ? '<p class="flex items-center justify-center gap-2 text-center text-ink3 py-16"><span class="material-symbols-outlined lab-ic text-ink3">list</span>왼쪽에서 중단원을 선택하세요.</p>'
      : (subs.length
          ? subs.map(subunitItem).join('')
          : '<p class="text-center text-ink3 py-10">이 중단원에는 소단원이 없습니다.</p>');
    if (animate) { list.classList.remove('swap-in'); void list.offsetWidth; list.classList.add('swap-in'); }

    document.querySelectorAll('#subunit-list a[href="#"]').forEach((a) => a.addEventListener('click', (e) => e.preventDefault()));
    document.querySelectorAll('#subunit-list .card-toggle').forEach((btn) => btn.addEventListener('click', () => {
      const box = btn.nextElementSibling;
      const open = btn.querySelector('.arrow').classList.toggle('rotate-180');
      btn.setAttribute('aria-expanded', open);
      setOpen(box, open);
    }));
    document.querySelectorAll('#subunit-list .mat-html-toggle').forEach((btn) => btn.addEventListener('click', () => {
      const panel = document.getElementById(btn.dataset.panel);
      const arrow = btn.querySelector('.mat-html-arrow');
      const opening = !arrow.classList.contains('rotate-180');
      arrow.classList.toggle('rotate-180', opening);
      btn.setAttribute('aria-expanded', opening);
      if (opening) {
        const iframe = panel.querySelector('iframe');
        if (!iframe.dataset.loaded) { iframe.dataset.loaded = '1'; loadHtmlIntoIframe(iframe, htmlSrcOf(btn)); }
      }
      setOpen(panel, opening);
    }));
    document.querySelectorAll('#subunit-list .mat-html-newtab').forEach((btn) => btn.addEventListener('click', (e) => {
      e.stopPropagation();
      openHtmlMaterial(htmlSrcOf(btn));
    }));
    // 저장소 자료 카드: 누르는 순간 서명 링크를 받아 새 탭으로 연다(주소를 미리 박아 두지 않는다).
    document.querySelectorAll('#subunit-list a[data-mat]').forEach((a) => a.addEventListener('click', (e) => {
      e.preventDefault();
      openInNewTab(() => materialUrl(a.dataset.mat));
    }));
    if (state.isAdmin) {
      document.querySelectorAll('#subunit-list .add-material').forEach((btn) => btn.addEventListener('click', (e) => { e.stopPropagation(); openMatModal(btn.dataset.addSub); }));
      document.querySelectorAll('#subunit-list .edit-material').forEach((btn) => btn.addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); openMatEdit(btn.dataset.editMat); }));
    }
  }

  function render(animate) { findSelection(); renderSidebar(animate); renderMain(animate); }

  // ================= 교사: 이 화면에서 자료 추가/삭제 =================
  async function reloadTree() {
    state.tree = await fetchSubjectTree(subjectId);
    render();
    if (state.subunitId) scrollToActive();
  }

  let matModalEl = null;
  function ensureMatModal() {
    if (matModalEl) return matModalEl;
    const el = document.createElement('div');
    el.id = 'mat-modal';
    el.className = 'hidden fixed inset-0 z-[70] bg-ink/40 flex items-center justify-center p-4';
    el.innerHTML = `<div class="card rounded-xl w-full max-w-md max-h-[90vh] overflow-y-auto p-6 shadow-lift">
      <div class="flex items-center justify-between mb-5"><h3 id="mat-title" class="text-lg font-extrabold tracking-tightest text-ink">자료 추가</h3>
        <button id="mat-close" class="p-1 text-ink3 hover:text-signal"><span class="material-symbols-outlined lab-ic">close</span></button></div>
      <form id="mat-form" class="space-y-sm"></form></div>`;
    document.body.appendChild(el);
    el.addEventListener('click', (e) => { if (e.target === el) closeMatModal(); });
    el.querySelector('#mat-close').addEventListener('click', closeMatModal);
    matModalEl = el;
    return el;
  }
  function matFormHtml(mat) {
    const isEdit = !!mat;
    const isFile = mat ? !!MATERIAL_TYPES[mat.type].file : false;
    const typeOpts = Object.entries(MATERIAL_TYPES).map(([k, t]) => `<option value="${k}" ${mat && mat.type === k ? 'selected' : ''}>${esc(t.label)}</option>`).join('');
    const curNote = isEdit
      ? (mat.storage_path
          ? `<p class="text-caption text-on-surface-variant mt-1">현재 파일: <b>${esc(mat.original_filename || '업로드됨')}</b> <span class="text-outline">— 바꾸려면 새로 선택(선택)</span></p>`
          : (isFile && mat.url ? `<p class="text-caption text-on-surface-variant mt-1">현재: 드라이브/링크 자료 <span class="text-outline">— 바꾸려면 새로 선택(선택)</span></p>` : ''))
      : '';
    const publicChecked = mat ? (mat.teacher_only ? '' : 'checked') : 'checked';
    // 저장된 파일(storage_path)이 있으면 URL칸은 비워둔다(교과서 PDF 편집 시 링크로 오인 방지)
    const urlVal = (isEdit && !mat.storage_path && mat.url && mat.url !== '#') ? mat.url : '';
    return `
      <div><label class="text-label-md text-on-surface-variant">자료 유형</label>
        <select name="type" id="m2-type" class="w-full mt-1 rounded-lg border-outline-variant focus:border-primary focus:ring-primary">${typeOpts}</select></div>
      <div><label class="text-label-md text-on-surface-variant">이름 <span class="text-outline">(비우면 유형 기본)</span></label>
        <input name="name" id="m2-name" type="text" value="${esc(mat ? (mat.name || '') : '')}" class="w-full mt-1 rounded-lg border-outline-variant focus:border-primary focus:ring-primary" placeholder="예: 1강 학습지"></div>
      <div id="m2-file-field"><label class="text-label-md text-on-surface-variant">파일 업로드 <span class="text-outline">(선생님 구글 드라이브에 저장)</span></label>
        <input name="file" id="m2-file" type="file" class="w-full mt-1 text-caption">
        ${curNote}
        <div id="m2-split" class="hidden mt-2 rounded-lg bg-paper2 border border-faint p-2.5">
          <label class="text-caption font-bold text-ink2">일부만 올리기 — 페이지 범위 <span class="text-outline font-normal">(선택, 비우면 전체)</span></label>
          <input name="page_range" id="m2-range" type="text" inputmode="numeric" class="w-full mt-1 rounded-lg border-outline-variant focus:border-primary focus:ring-primary text-[14px]" placeholder="예: 1-40 또는 3,5,10-20">
          <p id="m2-split-note" class="text-caption text-on-surface-variant mt-1"></p>
        </div>
        <div class="mt-2 flex items-center gap-2"><span class="text-caption text-on-surface-variant">또는</span>
          <button type="button" id="m2-drive" class="inline-flex items-center gap-1 text-caption px-2.5 py-1.5 rounded-lg border border-outline-variant hover:bg-surface-container transition-colors"><span class="material-symbols-outlined text-[16px] text-primary">add_to_drive</span>구글 드라이브에서 선택 <span class="text-outline">(용량 0)</span></button></div>
        <p id="m2-picked" class="text-caption text-primary mt-1 hidden"></p>
        <input type="hidden" name="drive_url" id="m2-drive-url"><input type="hidden" name="drive_name" id="m2-drive-name"><input type="hidden" name="drive_id" id="m2-drive-id"></div>
      <div id="m2-url-field" class="hidden"><label class="text-label-md text-on-surface-variant">링크 주소 (URL)</label>
        <input name="url" id="m2-url" type="url" value="${esc(urlVal)}" class="w-full mt-1 rounded-lg border-outline-variant focus:border-primary focus:ring-primary" placeholder="https://..."></div>
      <div><label class="text-label-md text-on-surface-variant">부가 설명 <span class="text-outline">(선택)</span></label>
        <input name="meta" id="m2-meta" type="text" value="${esc(mat ? (mat.meta || '') : '')}" class="w-full mt-1 rounded-lg border-outline-variant focus:border-primary focus:ring-primary" placeholder="예: 12쪽"></div>
      <label class="flex items-center gap-2 p-1 cursor-pointer"><input type="checkbox" name="is_public" id="m2-public" ${publicChecked} class="rounded text-primary focus:ring-primary"><span class="text-body-md">학생에게 공개 <span class="text-caption text-on-surface-variant">(체크 해제 시 교사만 보기)</span></span></label>
      <div><label class="text-label-md text-on-surface-variant">공개 기간 <span class="text-outline">(선택, 비우면 항상 공개)</span></label>
        <div class="flex items-center gap-2 mt-1">
          <input name="visible_from" id="m2-vfrom" type="datetime-local" value="${toLocalInput(mat && mat.visible_from)}" class="flex-1 min-w-0 rounded-lg border-outline-variant focus:border-primary focus:ring-primary text-[13px]">
          <span class="text-ink3 shrink-0">~</span>
          <input name="visible_until" id="m2-vuntil" type="datetime-local" value="${toLocalInput(mat && mat.visible_until)}" class="flex-1 min-w-0 rounded-lg border-outline-variant focus:border-primary focus:ring-primary text-[13px]">
        </div>
        <p class="text-caption text-on-surface-variant mt-1">시작만 적으면 그때부터 계속, 종료만 적으면 그때까지 공개돼요. 기간 밖에는 교사만 보여요.</p></div>
      <div class="flex gap-2 pt-1">
        ${isEdit ? `<button type="button" id="m2-delete" class="flex items-center gap-1 border border-error/50 text-error py-2.5 px-3.5 rounded-lg text-[14px] font-bold hover:bg-error hover:text-white transition-colors"><span class="material-symbols-outlined lab-ic text-[18px]">delete</span>삭제</button>` : ''}
        <button type="button" id="m2-cancel" class="flex-1 border border-faint py-2.5 rounded-lg text-[14px] font-bold text-ink3 hover:bg-paper2 transition-colors">취소</button>
        <button type="submit" id="m2-save" class="flex-1 bg-ink text-paper py-2.5 rounded-lg text-[14px] font-bold hover:bg-ink2 transition-colors">저장</button></div>`;
  }
  function findMaterial(id) {
    for (const u of state.tree.units || []) for (const m of u.mid_units || []) for (const s of m.subunits || []) for (const mat of s.materials || []) { if (mat.id === id) return { mat, subId: s.id }; }
    return null;
  }
  function openMatEdit(id) { const f = findMaterial(id); if (f) openMatModal(f.subId, f.mat); }
  function openMatModal(subId, mat) {
    state.addingSubId = subId;
    state.editingMat = mat || null;
    ensureMatModal();
    matModalEl.querySelector('#mat-title').textContent = mat ? '자료 수정' : '자료 추가';
    const form = matModalEl.querySelector('#mat-form');
    form.innerHTML = matFormHtml(mat);
    const sel = form.querySelector('#m2-type');
    const sync = () => { const t = MATERIAL_TYPES[sel.value]; form.querySelector('#m2-file-field').classList.toggle('hidden', !(t.file || t.upload)); form.querySelector('#m2-url-field').classList.toggle('hidden', t.file); };
    sel.addEventListener('change', sync); sync();
    // PDF를 고르면 "일부만 올리기(페이지 범위)" 칸 표시 + 전체 쪽수 안내
    const fileInput = form.querySelector('#m2-file');
    window.DB.wireFileDrop(fileInput);
    fileInput.addEventListener('change', async () => {
      const box = form.querySelector('#m2-split'); const note = form.querySelector('#m2-split-note');
      const f = fileInput.files && fileInput.files[0];
      const isPdf = !!f && (f.type === 'application/pdf' || /\.pdf$/i.test(f.name));
      box.classList.toggle('hidden', !isPdf);
      if (!isPdf) { form.querySelector('#m2-range').value = ''; return; }
      note.textContent = '전체 쪽수 확인 중…';
      try { note.textContent = `전체 ${await pdfPageCount(f)}쪽 · ${(f.size / 1048576).toFixed(1)} MB — 범위를 적으면 그 부분만 추출해 올려요.`; }
      catch (_e) { note.textContent = '쪽수를 읽지 못했습니다. 범위를 적으면 저장할 때 추출을 시도해요.'; }
    });
    form.querySelector('#m2-drive').addEventListener('click', () => openDrivePicker(form));
    form.querySelector('#m2-cancel').addEventListener('click', closeMatModal);
    const delBtn = form.querySelector('#m2-delete');
    if (delBtn && mat) delBtn.addEventListener('click', () => deleteMaterial(mat.id, mat.storage_path, true));
    form.onsubmit = onMatSubmit;
    matModalEl.classList.remove('hidden');
  }
  function closeMatModal() { if (matModalEl) { matModalEl.classList.add('hidden'); matModalEl.querySelector('#mat-form').innerHTML = ''; } state.addingSubId = null; state.editingMat = null; }

  async function openDrivePicker(form) {
    const btn = form.querySelector('#m2-drive'); const old = btn.innerHTML; btn.disabled = true; btn.textContent = '여는 중…';
    let doc = null;
    try { doc = await pickDriveFile(); }
    catch (e) { alert('드라이브 선택기 열기 실패: ' + e.message); }
    btn.disabled = false; btn.innerHTML = old;
    if (!doc) return;
    const picked = form.querySelector('#m2-picked');
    picked.classList.remove('hidden');
    // 공유 권한은 걸지 않는다 — 프록시가 선생님 토큰으로 읽어 오므로 파일은 비공개로 두면 된다.
    {
      form.querySelector('#m2-drive-id').value = doc.id;
      form.querySelector('#m2-drive-url').value = doc.url;
      form.querySelector('#m2-drive-name').value = doc.name;
      const nameInput = form.querySelector('#m2-name'); if (nameInput && !nameInput.value.trim()) nameInput.value = doc.name;
      const fi = form.querySelector('#m2-file'); if (fi) fi.value = '';
      const sb = form.querySelector('#m2-split'); if (sb) { sb.classList.add('hidden'); form.querySelector('#m2-range').value = ''; }
      picked.textContent = '✓ 드라이브 파일 선택됨: ' + (doc.name || doc.id) + ' — 저장하면 등록됩니다(파일은 비공개 그대로).';
    }
  }
  // 소단원 id → [대단원명, 중단원명] (드라이브 폴더 경로용)
  function unitPathNames(subId) {
    const t = state.tree || {};
    for (const u of (t.units || [])) for (const m of (u.mid_units || [])) for (const su of (m.subunits || [])) {
      if (su.id === subId) return [u.name || '', m.name || ''];
    }
    return [];
  }
  async function onMatSubmit(e) {
    e.preventDefault();
    const form = e.target;
    const saveBtn = form.querySelector('#m2-save'); saveBtn.disabled = true; saveBtn.textContent = '저장 중…';
    let driveWarn = '';
    try {
      const editing = state.editingMat;
      const fd = new FormData(form);
      const type = fd.get('type'); const t = MATERIAL_TYPES[type];
      const payload = { type, name: (fd.get('name') || '').trim(), meta: (fd.get('meta') || '').trim(), teacher_only: fd.get('is_public') !== 'on' };
      const vf = (fd.get('visible_from') || '').trim(); const vu = (fd.get('visible_until') || '').trim();
      payload.visible_from = vf ? new Date(vf).toISOString() : null;
      payload.visible_until = vu ? new Date(vu).toISOString() : null;
      if (payload.visible_from && payload.visible_until && payload.visible_from >= payload.visible_until) throw new Error('공개 종료가 시작보다 빠릅니다. 기간을 확인하세요.');
      if (!editing) { payload.subunit_id = state.addingSubId; payload.sort_order = Date.now() % 100000; }
      if (t.file || t.upload) {
        const driveUrl = (fd.get('drive_url') || '').trim();
        const file = fd.get('file');
        const urlInput = (fd.get('url') || '').trim(); // upload 허용 유형(교과서)은 링크칸도 있음
        if (driveUrl) {
          // Picker 로 고른 선생님 원본. 'gdriveref:' 로 두면 프록시가 서빙하고, 자료를 지워도 파일은 안 지운다.
          payload.url = driveUrl;
          payload.storage_path = 'gdriveref:' + (fd.get('drive_id') || '').trim();
          payload.original_filename = (fd.get('drive_name') || '').trim();
          if (editing && editing.storage_path) await removeMaterialFile(editing.storage_path);
        } else if (file && file.size) {
          let up = file;
          let didSplit = false;
          const range = (fd.get('page_range') || '').trim();
          if (range && (file.type === 'application/pdf' || /\.pdf$/i.test(file.name))) {
            saveBtn.textContent = 'PDF 추출 중…';
            const sp = await splitPdfFile(file, range);
            up = sp.file; didSplit = true;
            if (!payload.meta) payload.meta = `p.${sp.label} 발췌 (전체 ${sp.total}쪽 중 ${sp.pages}쪽)`;
          }
          // 업로드 파일은 선생님 구글 드라이브(학교›년도›수업자료›과목›대단원›중단원)로. 단, html 자료는
          // 아코디언(fetch→iframe srcdoc) 렌더링 때문에 CORS가 되는 우리 스토리지에 둬야 한다.
          const isHtml = type === 'html' || /\.html?$/i.test(up.name);
          let stored = null;
          if (!isHtml) {
            saveBtn.textContent = '드라이브 업로드 중…';
            const unitNames = unitPathNames(editing ? editing.subunit_id : state.addingSubId);
            const folderPath = [(state.tree && state.tree.name) || ''].concat(unitNames);
            const driveName = window.DB.materialDriveName({ name: payload.name, typeLabel: t.label, fileName: up.name, unitNames, excerpt: didSplit });
            try { stored = await uploadMaterialToDrive(up, folderPath, driveName); }
            catch (e) { driveWarn = e.message || String(e); }
          }
          if (!stored) {
            saveBtn.textContent = '저장 중…';
            const path2 = `${(editing ? editing.subunit_id : state.addingSubId)}/${Date.now()}-${safeStorageName(up.name)}`;
            await uploadToBucket('materials', path2, up);
            stored = { storage_path: path2, url: window.DB.supabase.storage.from('materials').getPublicUrl(path2).data.publicUrl };
          }
          saveBtn.textContent = '저장 중…';
          payload.storage_path = stored.storage_path; payload.original_filename = up.name; payload.url = stored.url;
          if (editing && editing.storage_path && editing.storage_path !== payload.storage_path) await removeMaterialFile(editing.storage_path);
        } else if (t.upload && urlInput) {
          // 교과서 등: 파일 대신 링크로 등록. 기존 업로드 파일이 있으면 정리.
          payload.url = urlInput; payload.storage_path = ''; payload.original_filename = '';
          if (editing && editing.storage_path) await removeMaterialFile(editing.storage_path);
        } else if (editing) {
          // 새 파일/링크를 안 주면 기존 것 유지
          payload.url = editing.url; payload.storage_path = editing.storage_path || ''; payload.original_filename = editing.original_filename || '';
        } else throw new Error(t.upload ? 'PDF 파일을 올리거나 링크 주소를 입력하세요.' : '파일을 업로드하거나 드라이브에서 고르세요.');
      } else {
        payload.url = (fd.get('url') || '').trim(); payload.storage_path = '';
        if (!payload.url) throw new Error('링크 주소를 입력하세요.');
      }
      if (editing) {
        const { error } = await window.DB.supabase.from('materials').update(payload).eq('id', editing.id);
        if (error) throw error;
      } else {
        const { error } = await window.DB.supabase.from('materials').insert(payload);
        if (error) throw error;
      }
      closeMatModal();
      await reloadTree();
      if (driveWarn) alert('구글 드라이브 업로드가 안 되어 수파베이스 저장소에 대신 저장했어요.\n(' + driveWarn + ')');
    } catch (err) { alert('저장 실패: ' + err.message); } finally { if (form.querySelector('#m2-save')) { saveBtn.disabled = false; saveBtn.textContent = '저장'; } }
  }
  async function deleteMaterial(id, storagePath, fromModal) {
    if (!confirm('이 자료를 삭제할까요?')) return;
    try {
      if (storagePath) await removeMaterialFile(storagePath);
      const { error } = await window.DB.supabase.from('materials').delete().eq('id', id);
      if (error) throw error;
      if (fromModal) closeMatModal();
      await reloadTree();
    } catch (e) { alert('삭제 실패: ' + e.message); }
  }

  // ---------- 시작 ----------
  (async () => {
    const auth = await requireLogin(); // 로그인 필수
    if (!auth) return;
    state.isAdmin = auth.isAdmin;   // 비번 미변경 학생은 student 가 null 이라 !student 로는 교사로 잡힌다
    state.student = auth.student || null;
    // 헤더: 교사 시점 배지·관리자·로그아웃
    $('who').textContent = auth.student ? auth.student.name : '';
    if (state.isAdmin) { $('teacher-badge').classList.remove('hidden'); $('admin-link').classList.replace('hidden', 'flex'); }
    $('logout-btn').addEventListener('click', async () => { await signOut(); location.replace('학생-로그인.html'); });
    if (!subjectId) { location.replace('과목-선택.html'); return; }
    try {
      state.tree = await fetchSubjectTree(subjectId);
      $('subject-title').textContent = state.tree.name;
      document.title = `${state.tree.name} · 정환쌤과 함께하는 과학 수업`;
      $('home-link').href = `과목-홈.html?subject=${encodeURIComponent(subjectId)}`;
      $('qna-link').href = `질의응답.html?subject=${encodeURIComponent(subjectId)}`;
      $('assess-link').href = `수행평가-공지.html?subject=${encodeURIComponent(subjectId)}`;
      $('submit-link').href = `산출물-제출.html?subject=${encodeURIComponent(subjectId)}`;
      // ?sub=<소단원id> 로 들어오면 그 소단원을 펼침 (질의응답 사이드바 등에서 연결)
      const subParam = params.get('sub');
      let target = null;
      if (subParam) {
        for (const u of state.tree.units || []) {
          for (const m of u.mid_units || []) {
            if ((m.subunits || []).some((s) => s.id === subParam)) { target = { unit: u, mid: m }; break; }
          }
          if (target) break;
        }
      }
      if (target) {
        state.lastUnitId = target.unit.id;
        state.midUnitId = target.mid.id;
        state.subunitId = subParam;
      } else {
        // 초기: 첫 대단원 열고 첫 중단원 선택
        const firstUnit = (state.tree.units || [])[0];
        const firstMid = firstUnit && (firstUnit.mid_units || [])[0];
        state.lastUnitId = firstUnit ? firstUnit.id : null;
        state.midUnitId = firstMid ? firstMid.id : null;
      }
      render();
      if (target) scrollToActive();
    } catch (e) {
      $('subunit-list').innerHTML = `<p class="text-error py-lg text-center">단원을 불러오지 못했습니다. (${esc(e.message)})</p>`;
    }
  })();
</script>
